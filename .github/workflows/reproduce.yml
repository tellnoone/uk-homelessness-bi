name: Reproduce

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild the warehouse and every output from the raw CSVs
        run: python run_all.py
      - name: Committed outputs must match a fresh build
        run: git diff --exit-code -- outputs/
      - run: python -m pytest
      - name: Check every number in the README against the outputs
        run: python verify_report.py
